<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalog</title>
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header__wrapper">
        <div class="header__logo">
          <img src="./assets/images/svg/noctopus.svg" alt="logo">
        </div>
        <div class="header__main">
          <nav class="header__nav">
            <ul class="header__menu">
              <li class="header__item">
                <a href="#" class="header__link">Home</a>
              </li>
              <li class="header__item">
                <a href="#" class="header__link">About us</a>
              </li>
              <li class="header__item">
                <a href="#" class="header__link">Catalog</a>
              </li>
              <li class="header__item">
                <a href="#" class="header__link">Settings</a>
              </li>
            </ul>
          </nav>
          <div class="header__main--buttons">
            <div class="profile" id="user-profile">
              <div class="profile__avatar">
                <img src="./assets/images/jpg/profile-avatar.jpg" alt="profile photo" class="profile__avatar--img">
              </div>
              <span class="profile__username">username1234</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>
  <main class="main">
    <section class="products__lists">
      <div class="main___hero">
        <div class="container">
          <h1 class="main___hero--title">Shop catalog</h1>
          <div class="main__hero--description">
            <p>In this section of the site you can purchase the products you need</p>
          </div>
        </div>
      </div>
        <div class="catalog__products--price container">
          <div class="products__price--wrapper">
            <p>Total price:</p>
            <span>$0,00</span>
          </div>
        </div>
        <div class="main__wrapper container">
          <aside class="sidebar">
            <h3 class="sidebar__category">Category</h3>
            <ul class="category__list" id="category-list">
              <li class="category__list--item" id="all">All</li>
              <li class="category__list--item" id="available">Available</li>
              <li class="category__list--item" id="no-available">Not available</li>
              <li class="category__list--item" id="coming-soon">Coming soon</li>
            </ul>
          </aside>
          <div class="products" id="products-container">
            <!-- Продукты берутся из json файла -->
          </div>
        </div>
    </section>
  </main>

  <script src="./scripts/catalog-products.js"></script>
  <script src="./scripts/catalog-filters.js"></script>
</body>
</html>
